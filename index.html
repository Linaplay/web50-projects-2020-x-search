<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Search</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="nav-links"> 
        <a href="advance.html">Advanced Search</a>
        <a href="image.html">Image Search</a>
        </div>
        <div class="main-container">
         <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Google" class="logo">
           <form class="search-form" action="https://google.com/search" method="get"> 
             <div class="search-bar-container">
                <input class="search-input" autofocus type="text" name="q">
             </div>
             <div class="search-buttons">
                <input type="submit" value="Google Search">
                <input type="submit" value="I'm Feeling Lucky" name="btnI">
            </div>
           </form>
        </div>
    </body>
</html>
